<mat-sidenav-container class="sidenav-container">

  <!-- Sidebar -->
  <mat-sidenav mode="side" opened class="sidenav">
    <div class="sidenav-header">
      <mat-icon class="logo-icon">inventory_2</mat-icon>
      <span class="logo-text">Inventario</span>
    </div>

    <mat-nav-list>
      @for (item of navItems; track item.route) {
        <a mat-list-item
           [routerLink]="item.route"
           routerLinkActive="active-link">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>

    <div class="sidenav-footer">
      <div class="user-info">
        <mat-icon>account_circle</mat-icon>
        <div>
          <span class="username">{{ authService.currentUser()?.username }}</span>
          <span class="role">{{ authService.currentUser()?.role }}</span>
        </div>
      </div>
      <button mat-icon-button (click)="logout()" matTooltip="Cerrar sesión">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </mat-sidenav>

  <!-- Contenido principal -->
  <mat-sidenav-content class="main-content">
    <mat-toolbar color="primary" class="toolbar">
      <span>Sistema de Gestión de Inventario</span>
    </mat-toolbar>
    <div class="content-area">
      <router-outlet />
    </div>
  </mat-sidenav-content>

</mat-sidenav-container>

<!-- Spinner global -->
<ngx-spinner
  bdColor="rgba(0,0,0,0.4)"
  size="medium"
  color="#fff"
  type="ball-scale-multiple"
  [fullScreen]="true">
  <p style="color: white; margin-top: 16px; font-size: 14px;">Cargando...</p>
</ngx-spinner>
